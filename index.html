<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🧠 AI AGENTS NETWORK 2027</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e27; color: #e8eef5; font-family: 'Courier New', monospace; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100vh; }

        .sidebar {
            width: 280px;
            background: #0d1117;
            border-right: 2px solid #39ff14;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar h1 { color: #39ff14; font-size: 16px; margin-bottom: 10px; letter-spacing: 2px; }
        .sidebar p { color: #8b949e; font-size: 11px; margin-bottom: 20px; }

        .stats { display: flex; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #39ff14; }
        .stat { text-align: center; }
        .stat-num { color: #39ff14; font-size: 18px; font-weight: bold; }
        .stat-label { color: #8b949e; font-size: 10px; }

        .repo-item {
            padding: 10px;
            margin: 8px 0;
            background: #161b22;
            border: 1px solid #39ff14;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }

        .repo-item:hover {
            background: #0f1a2e;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .repo-name { color: #39ff14; font-weight: bold; }
        .repo-info { color: #8b949e; font-size: 10px; }

        .canvas {
            flex: 1;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            position: relative;
        }

        svg { width: 100%; height: 100%; }

        .link {
            stroke: #39ff14;
            stroke-opacity: 0.2;
            stroke-width: 1.5;
        }

        .link.active {
            stroke: #39ff14;
            stroke-opacity: 0.6;
            stroke-width: 2.5;
        }

        .node {
            cursor: pointer;
        }

        .node-circle {
            filter: drop-shadow(0 0 5px #39ff14);
            transition: all 0.3s;
        }

        .node-circle:hover {
            filter: drop-shadow(0 0 15px #39ff14);
        }

        .node-circle.active {
            filter: drop-shadow(0 0 25px #39ff14);
            stroke: #ffff00;
            stroke-width: 3;
        }

        .node-label {
            font-size: 10px;
            font-weight: bold;
            text-anchor: middle;
            pointer-events: none;
            fill: white;
            text-shadow: 0 1px 3px #0a0e27;
        }

        .info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(13, 17, 23, 0.95);
            border: 2px solid #39ff14;
            padding: 15px;
            border-radius: 4px;
            max-width: 280px;
            display: none;
            font-size: 12px;
        }

        .info-panel.active { display: block; }
        .info-panel h3 { color: #39ff14; margin-bottom: 8px; }
        .info-panel p { color: #8b949e; margin: 5px 0; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🧠 CLAUDE / AI AGENTS</h1>
            <p>LIVE 00:10:44 • a network of repos</p>

            <div class="stats">
                <div class="stat">
                    <div class="stat-num" id="cloned">12</div>
                    <div class="stat-label">CLONED</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="stars">531K</div>
                    <div class="stat-label">STARS</div>
                </div>
                <div class="stat">
                    <div class="stat-num" id="active">12</div>
                    <div class="stat-label">ACTIVE</div>
                </div>
            </div>

            <div id="repoList"></div>
        </div>

        <div class="canvas">
            <svg id="network"></svg>
            <div class="info-panel" id="infoPanel">
                <h3 id="infoName"></h3>
                <p id="infoRole"></p>
                <p id="infoDesc"></p>
            </div>
        </div>
    </div>

    <script>
        const repos = [
            { id: "paperclip", name: "Paperclip", role: "ORCHESTRATION", desc: "Agent orchestration framework", stars: 125, color: "#ff006e" },
            { id: "agent-reach", name: "Agent Reach", role: "WEB ACCESS", desc: "Web browsing & scraping", stars: 95, color: "#00d9ff" },
            { id: "career-ops", name: "Career-ops", role: "JOB AUTOMATION", desc: "Job search automation", stars: 78, color: "#ffd60a" },
            { id: "strix", name: "Strix", role: "SECURITY", desc: "Security & compliance", stars: 56, color: "#a100f2" },
            { id: "ai-website", name: "AI Website", role: "DEV AUTOMATION", desc: "Website generation", stars: 42, color: "#ff9500" },
            { id: "hypit", name: "Hypit", role: "VIDEO", desc: "Video creation automation", stars: 68, color: "#ff006e" },
            { id: "officecli", name: "OfficeCLI", role: "OFFICE", desc: "Office documents", stars: 32, color: "#39ff14" },
            { id: "llamaindex", name: "LlamaIndex", role: "DATA/VECTOR", desc: "Data indexing", stars: 54, color: "#ff9500" },
            { id: "langchain", name: "LangChain", role: "FRAMEWORK", desc: "LLM framework", stars: 89, color: "#00ffff" },
            { id: "autogen", name: "AutoGen", role: "MULTI-AGENT", desc: "Agent conversations", stars: 32, color: "#ff00ff" },
            { id: "dify", name: "Dify", role: "NO-CODE", desc: "LLM app builder", stars: 42, color: "#ffaa00" },
            { id: "openinterp", name: "Open Interp", role: "CODE EXECUTION", desc: "Code execution", stars: 48, color: "#00ff00" }
        ];

        const links = [
            { source: "paperclip", target: "agent-reach" },
            { source: "paperclip", target: "career-ops" },
            { source: "paperclip", target: "strix" },
            { source: "paperclip", target: "langchain" },
            { source: "agent-reach", target: "career-ops" },
            { source: "langchain", target: "llamaindex" },
            { source: "langchain", target: "autogen" },
            { source: "llamaindex", target: "career-ops" },
            { source: "paperclip", target: "hypit" },
            { source: "paperclip", target: "ai-website" },
            { source: "ai-website", target: "openinterp" },
            { source: "openinterp", target: "strix" },
            { source: "dify", target: "langchain" },
            { source: "autogen", target: "career-ops" }
        ];

        const width = document.querySelector('.canvas').clientWidth;
        const height = window.innerHeight;

        const svg = d3.select('#network')
            .attr('viewBox', [0, 0, width, height]);

        const simulation = d3.forceSimulation(repos)
            .force('link', d3.forceLink(links).id(d => d.id).distance(150))
            .force('charge', d3.forceManyBody().strength(-800))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide(60));

        const link = svg.selectAll('line')
            .data(links)
            .enter()
            .append('line')
            .attr('class', 'link')
            .attr('stroke-width', 1.5);

        const node = svg.selectAll('.node')
            .data(repos)
            .enter()
            .append('g')
            .attr('class', 'node')
            .on('click', (e, d) => selectRepo(d.id));

        node.append('circle')
            .attr('class', 'node-circle')
            .attr('r', d => Math.sqrt(d.stars / 1000) + 20)
            .attr('fill', d => d.color)
            .attr('stroke', '#39ff14')
            .attr('stroke-width', 1.5);

        node.append('text')
            .attr('class', 'node-label')
            .attr('text-anchor', 'middle')
            .attr('dy', '.3em')
            .text(d => d.name.length > 12 ? d.name.substring(0, 10) + '..' : d.name);

        simulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        function renderSidebar() {
            const html = repos.map(r => `
                <div class="repo-item" onclick="selectRepo('${r.id}')">
                    <div class="repo-name">${r.name}</div>
                    <div class="repo-info">${r.role} • ${r.stars}K</div>
                </div>
            `).join('');
            document.getElementById('repoList').innerHTML = html;
        }

        window.selectRepo = function(id) {
            const repo = repos.find(r => r.id === id);
            if (!repo) return;

            d3.selectAll('.node-circle').classed('active', false);
            d3.selectAll('.node').filter(d => d.id === id).select('.node-circle').classed('active', true);

            d3.selectAll('.repo-item').style('background', '#161b22');
            d3.selectAll('.repo-item').filter((d, i) => repos[i].id === id).style('background', '#0f1a2e').style('box-shadow', '0 0 15px rgba(57, 255, 20, 0.5)');

            document.getElementById('infoName').textContent = repo.name + ' ⭐';
            document.getElementById('infoRole').textContent = repo.role;
            document.getElementById('infoDesc').textContent = repo.desc + ` • ${repo.stars}K stars`;
            document.getElementById('infoPanel').classList.add('active');
        };

        renderSidebar();
    </script>
</body>
</html>
