<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 AI AGENTS 2027</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e27; color: #fff; font-family: 'Courier New'; height: 100vh; overflow: hidden; }
        .container { display: flex; height: 100%; }

        .sidebar { width: 300px; background: #0d1117; border-right: 2px solid #39ff14; padding: 20px; overflow-y: auto; }
        .sidebar h1 { color: #39ff14; font-size: 16px; margin-bottom: 20px; letter-spacing: 2px; }

        .stats { display: flex; gap: 20px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #39ff14; }
        .stat { text-align: center; }
        .stat-num { color: #39ff14; font-size: 20px; font-weight: bold; }
        .stat-label { color: #8b949e; font-size: 11px; }

        .repo-btn {
            display: block; width: 100%; padding: 12px; margin: 10px 0;
            background: #161b22; border: 1px solid #39ff14; border-radius: 4px;
            color: #39ff14; cursor: pointer; font-size: 12px; font-weight: bold;
            transition: all 0.3s;
            text-align: left;
        }

        .repo-btn:hover { background: #0f1a2e; box-shadow: 0 0 10px #39ff14; }
        .repo-btn.active { background: #0f1a2e; box-shadow: 0 0 20px #39ff14; }

        .canvas {
            flex: 1; background: linear-gradient(135deg, #0a0e27, #1a1f3a);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px;
        }

        .title { color: #39ff14; font-size: 28px; margin-bottom: 30px; text-shadow: 0 0 10px #39ff14; }

        .nodes {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px; margin-bottom: 30px; width: 100%;
        }

        .node {
            width: 100px; height: 100px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; cursor: pointer;
            transition: all 0.3s;
            border: 2px solid rgba(255,255,255,0.3);
            font-size: 11px; text-align: center;
            box-shadow: 0 0 15px var(--color);
        }

        .node:hover { transform: scale(1.1); box-shadow: 0 0 25px var(--color); }
        .node.active { transform: scale(1.2); border-color: white; box-shadow: 0 0 40px var(--color); }

        .info {
            background: rgba(13, 17, 23, 0.9); border: 2px solid #39ff14;
            padding: 20px; border-radius: 4px; max-width: 400px;
            display: none;
        }

        .info.active { display: block; }
        .info h2 { color: #39ff14; margin-bottom: 10px; }
        .info p { color: #8b949e; margin: 8px 0; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🧠 CLAUDE / AI AGENTS</h1>
            <p style="color: #8b949e; font-size: 11px; margin-bottom: 20px;">LIVE 00:10:44 • a network of repos</p>

            <div class="stats">
                <div class="stat">
                    <div class="stat-num">12</div>
                    <div class="stat-label">CLONED</div>
                </div>
                <div class="stat">
                    <div class="stat-num">531K</div>
                    <div class="stat-label">STARS</div>
                </div>
                <div class="stat">
                    <div class="stat-num">12</div>
                    <div class="stat-label">ACTIVE</div>
                </div>
            </div>

            <div id="repoList"></div>
        </div>

        <div class="canvas">
            <div class="title">🌐 AI AGENTS NETWORK 2027</div>
            <div class="nodes" id="nodes"></div>
            <div class="info" id="info">
                <h2 id="infoName"></h2>
                <p id="infoRole"></p>
                <p id="infoDesc"></p>
            </div>
        </div>
    </div>

    <script>
        const repos = [
            { name: "Paperclip", role: "ORCHESTRATION", desc: "Agent orchestration framework", stars: "125K", color: "#ff006e" },
            { name: "Agent Reach", role: "WEB ACCESS", desc: "Web browsing & scraping", stars: "95K", color: "#00d9ff" },
            { name: "Career-ops", role: "JOB AUTOMATION", desc: "Job search automation", stars: "78K", color: "#ffd60a" },
            { name: "Strix", role: "SECURITY", desc: "Security & compliance", stars: "56K", color: "#a100f2" },
            { name: "AI Website", role: "DEV AUTOMATION", desc: "Website generation", stars: "42K", color: "#ff9500" },
            { name: "Hypit", role: "VIDEO", desc: "Video creation", stars: "68K", color: "#ff006e" },
            { name: "OfficeCLI", role: "OFFICE", desc: "Office documents", stars: "32K", color: "#39ff14" },
            { name: "LlamaIndex", role: "DATA/VECTOR", desc: "Data indexing", stars: "54K", color: "#ff9500" },
            { name: "LangChain", role: "FRAMEWORK", desc: "LLM framework", stars: "89K", color: "#00ffff" },
            { name: "AutoGen", role: "MULTI-AGENT", desc: "Agent conversations", stars: "32K", color: "#ff00ff" },
            { name: "Dify", role: "NO-CODE", desc: "LLM app builder", stars: "42K", color: "#ffaa00" },
            { name: "Open Interp", role: "CODE EXECUTION", desc: "Code execution", stars: "48K", color: "#00ff00" }
        ];

        function render() {
            // Nodos
            const nodesDiv = document.getElementById('nodes');
            nodesDiv.innerHTML = repos.map((r, i) => `
                <div class="node" style="--color: ${r.color}; background: ${r.color};" onclick="select(${i})">
                    ${r.name}
                </div>
            `).join('');

            // Sidebar
            const list = document.getElementById('repoList');
            list.innerHTML = repos.map((r, i) => `
                <button class="repo-btn" onclick="select(${i})">${r.name} • ${r.role}</button>
            `).join('');
        }

        function select(i) {
            const r = repos[i];

            // Active
            document.querySelectorAll('.node').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.repo-btn').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.node')[i].classList.add('active');
            document.querySelectorAll('.repo-btn')[i].classList.add('active');

            // Info
            document.getElementById('infoName').textContent = '✨ ' + r.name;
            document.getElementById('infoRole').textContent = r.role;
            document.getElementById('infoDesc').textContent = r.desc + ' • ' + r.stars + ' stars';
            document.getElementById('info').classList.add('active');
        }

        render();
    </script>
</body>
</html>
